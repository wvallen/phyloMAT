<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>phyloMAT 2.0</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="atlas"></canvas>

  <div class="brand" id="btnHome" title="Home (tri)">
    <div class="logoSpin" aria-hidden="true">
      <!-- swap this SVG for your real logo -->
      <svg width="42" height="42" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" fill="none" stroke="black" stroke-width="6"/>
        <path d="M50 12 L62 50 L50 88 L38 50 Z" fill="black"/>
      </svg>
    </div>
    <div>
      <div class="brandTitle">phyloMAT 2.0</div>
      <div class="brandSub">explore mode</div>
    </div>
  </div>

  <aside class="dock">
    <div class="row">
      <button id="btnBack" class="btn">Back</button>
      <button id="btnReset" class="btn">Reset</button>
      <button id="btnPNG" class="btn">PNG</button>
      <button id="btnState" class="btn">state.xml</button>
      <button id="btnPrompt" class="btn">prompt</button>
    </div>

    <div class="row">
      <div class="k">Detail</div>
      <input id="slDetail" class="slider" type="range" min="1" max="5" value="2" />
      <div id="detailLabel" class="v">2</div>
    </div>

    <div class="row">
      <label class="chk"><input id="togClouds" type="checkbox" checked /> clouds</label>
      <label class="chk"><input id="togLabels" type="checkbox" checked /> labels</label>
      <label class="chk"><input id="togContext" type="checkbox" checked /> context</label>
    </div>

    <div class="panel">
      <div class="stat"><span class="k">Loaded</span> <span id="statLoaded" class="v">—</span></div>
      <div class="stat"><span class="k">Focus</span> <span id="statFocus" class="v">—</span></div>
      <div class="stat"><span class="k">Hover</span> <span id="statHover" class="v">—</span></div>
      <div class="stat"><span class="k">Pins</span> <span id="statPins" class="v">—</span></div>
    </div>

    <div class="panel">
      <div class="k">Breadcrumb</div>
      <div id="crumbs" class="crumbs">tri</div>
    </div>

    <div class="panel">
      <div class="k">Details</div>
      <div id="details" class="details">Click a node.</div>
    </div>

    <div class="foot">Click enters · Shift-click pins · Wheel changes detail</div>
  </aside>

  <script type="module" src="./engine.js"></script>
</body>
</html>
