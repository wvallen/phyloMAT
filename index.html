<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>phyloMAT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --ink: #111;
      --soft: #777;
      --bg: #ffffff;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      font-family: Georgia, "Times New Roman", serif;
    }

    .wrap {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lockup {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .logo {
      width: 88px;
      height: 88px;
      animation: slowspin 28s linear infinite;
    }

    @keyframes slowspin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .wordmark {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .title {
      font-size: 44px;
      letter-spacing: 0.04em;
      color: var(--ink);
      line-height: 1;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 14px;
      letter-spacing: 0.12em;
      color: var(--soft);
    }

    /* small screens */
    @media (max-width: 600px) {
      .logo {
        width: 64px;
        height: 64px;
      }
      .title {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="lockup">
      <!-- replace src with your logo filename -->
      <img class="logo" src="logo.svg" alt="phyloMAT logo" />

      <div class="wordmark">
        <div class="title">PhyloMAT</div>
        <div class="subtitle">Motif Analysis Tool for Phylogenomics</div>
      </div>
    </div>
  </div>
</body>
</html>
