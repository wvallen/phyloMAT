<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>phyloMAT 2.0</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="c"></canvas>

  <div class="brand" id="btnReturn" title="Return to current position">
    <img class="logoSpin" src="./logo.svg" alt="phyloMAT logo" />
    <div class="brandText">
      <div class="brandTitle">phyloMAT 2.0</div>
      <div class="brandSub">phylo-decision motif analysis tool</div>
    </div>
  </div>

  <aside class="dock">
    <div class="row">
      <button id="btnStart" class="btn">Start</button>
      <button id="btnTravel" class="btn" disabled>Travel</button>
      <button id="btnOverview" class="btn">Overview</button>
      <button id="btnReturn2" class="btn">Return</button>
      <button id="btnReset" class="btn">Reset</button>
      <button id="btnPNG" class="btn">PNG</button>
    </div>

    <div class="row">
      <div class="k">Openness</div>
      <input id="slOpen" class="slider" type="range" min="0" max="100" value="55" />
      <div id="lbOpen" class="v">0.55</div>
    </div>

    <div class="row">
      <div class="k">Horizon</div>
      <input id="slHor" class="slider" type="range" min="2" max="12" value="6" />
      <div id="lbHor" class="v">6</div>
    </div>

    <div class="row">
      <div class="k">Speed</div>
      <input id="slSpeed" class="slider" type="range" min="30" max="220" value="120" />
      <div id="lbSpeed" class="v">1.20</div>
    </div>

    <div class="row">
      <label class="chk"><input id="togBox" type="checkbox" checked /> box constraint</label>
      <label class="chk"><input id="togGhost" type="checkbox" checked /> ghost alternatives</label>
    </div>

    <div class="panel">
      <div class="stat"><span class="k2">Run</span> <span id="stRun" class="v2">—</span></div>
      <div class="stat"><span class="k2">Mode</span> <span id="stMode" class="v2">path</span></div>
      <div class="stat"><span class="k2">Step</span> <span id="stStep" class="v2">0</span></div>
      <div class="stat"><span class="k2">Options</span> <span id="stOpt" class="v2">0</span></div>
    </div>

    <div class="foot">
      click selects · click Travel commits · rapid double-click commits · Overview shows the whole run
    </div>
  </aside>

  <script type="module" src="./engine.js"></script>
</body>
</html>
