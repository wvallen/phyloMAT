<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>phyloMAT 2.0</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <!-- Full-screen atlas -->
  <canvas id="atlas"></canvas>

  <!-- Identity (top-left) -->
  <div class="brand" id="brandHome" title="Reset to overview">
    <div class="logoSpin" aria-hidden="true">
      <!-- Replace this SVG with your real logo SVG when ready -->
      <svg width="44" height="44" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" fill="none" stroke="black" stroke-width="6"/>
        <path d="M50 12 L62 50 L50 88 L38 50 Z" fill="black"/>
      </svg>
    </div>
    <div class="brandText">
      <div class="brandTitle">phyloMAT 2.0</div>
      <div class="brandSub">causal taxonomy atlas</div>
    </div>
  </div>

  <!-- Control dock (top-right) -->
  <aside class="dock">
    <div class="dockRow">
      <select id="gotoSelect" class="select">
        <option value="tri">tri</option>
      </select>
      <button id="btnGo" class="btn">Go</button>
      <button id="btnReset" class="btn">Reset</button>
    </div>

    <div class="dockRow">
      <button id="btnPNG" class="btn">Export PNG</button>
      <button id="btnState" class="btn">Export state.xml</button>
      <button id="btnPrompt" class="btn">Generate prompt</button>
    </div>

    <div class="dockGrid">
      <label class="chk"><input id="togClouds" type="checkbox" checked /> clouds</label>
      <label class="chk"><input id="togTaxEdges" type="checkbox" checked /> taxonomy edges</label>
      <label class="chk"><input id="togMesh" type="checkbox" checked /> mesh</label>
      <label class="chk"><input id="togLabels" type="checkbox" checked /> labels</label>
    </div>

    <div class="dockSliders">
      <div class="sliderRow">
        <div class="k">label</div>
        <input id="slLabel" class="slider" type="range" min="11" max="22" value="14" />
      </div>
      <div class="sliderRow">
        <div class="k">cloud</div>
        <input id="slCloud" class="slider" type="range" min="0" max="100" value="55" />
      </div>
      <div class="sliderRow">
        <div class="k">mesh</div>
        <input id="slMesh" class="slider" type="range" min="0" max="100" value="35" />
      </div>
      <div class="sliderRow">
        <div class="k">lock</div>
        <input id="slLock" class="slider" type="range" min="20" max="220" value="90" />
      </div>
    </div>

    <div class="dockStats">
      <div class="stat"><span class="k">Loaded</span> <span id="statLoaded" class="v">—</span></div>
      <div class="stat"><span class="k">Hover</span> <span id="statHover" class="v">—</span></div>
      <div class="stat"><span class="k">Selected</span> <span id="statSel" class="v">—</span></div>
      <div class="stat"><span class="k">Pins</span> <span id="statPins" class="v">—</span></div>
    </div>

    <div class="dockFoot">
      drag pans · wheel zooms · click selects · shift-click pins · double-click centers
    </div>
  </aside>

  <script type="module" src="./engine.js"></script>

  <script>
    // Brand click resets (no engine coupling required)
    document.getElementById("brandHome").addEventListener("click", () => {
      const btn = document.getElementById("btnReset");
      if (btn) btn.click();
    });
  </script>
</body>
</html>
