<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>phyloMAT</title>
  <style>
    :root{
      --paper:#fff;
      --ink:#000;
      --muted: rgba(0,0,0,0.55);
    }
    html,body{
      margin:0;
      width:100%;
      height:100%;
      background:var(--paper);
      color:var(--ink);
      font-family:"Courier New", Courier, monospace;
    }
    .wrap{
      height:100%;
      display:grid;
      place-items:center;
      padding:24px;
    }
    .card{
      text-align:center;
      max-width:520px;
    }
    .logo{
      width:96px;
      height:96px;
      display:block;
      margin:0 auto 18px auto;
      animation: spin 28s linear infinite;
      transform-origin: 50% 50%;
    }
    @keyframes spin{
      from{ transform: rotate(0deg); }
      to{ transform: rotate(360deg); }
    }
    h1{
      margin:0;
      font-size:28px;
      font-weight:normal;
      letter-spacing:0.5px;
    }
    .sub{
      margin-top:10px;
      font-size:14px;
      color:var(--muted);
      line-height:1.5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img class="logo" src="./logo.svg" alt="phyloMAT logo" />
      <h1>phyloMAT</h1>
      <div class="sub">Coming soon.</div>
    </div>
  </div>
</body>
</html>
