<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PhyloMAT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --ink: #111;
      --soft: #666;
      --faint: #9a9a9a;
      --bg: #ffffff;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      font-family: Georgia, "Times New Roman", serif;
    }

    .wrap {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .lockup {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .logo {
      width: clamp(72px, 9vw, 110px);
      height: auto;
      animation: slowspin 28s linear infinite;
    }

    @keyframes slowspin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .title {
      font-size: clamp(42px, 6.5vw, 78px);
      letter-spacing: 0.06em;
      color: var(--ink);
      line-height: 1;
      white-space: nowrap;
    }

    .subtitle {
      font-size: clamp(14px, 1.8vw, 18px);
      letter-spacing: 0.12em;
      color: var(--soft);
    }

    .paper {
      margin-top: 6px;
      font-size: clamp(12px, 1.5vw, 14px);
      letter-spacing: 0.08em;
    }

    .paper a {
      color: var(--faint);
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    .paper a:hover {
      color: var(--soft);
      border-bottom: 1px solid var(--soft);
    }

    @media (max-width: 600px) {
      .lockup {
        gap: 18px;
      }
      .subtitle {
        letter-spacing: 0.08em;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="stack">
      <div class="lockup">
        <img src="logo.svg" alt="PhyloMAT logo" class="logo" />
        <div class="title">PhyloMAT</div>
      </div>

      <div class="subtitle">
        Motif Analysis Tool for Phylogenomics
      </div>

      <div class="paper">
        <a href="https://pubmed.ncbi.nlm.nih.gov/15595740/" target="_blank" rel="noopener">
          Original publication
        </a>
      </div>
    </div>
  </div>
</body>
</html>
